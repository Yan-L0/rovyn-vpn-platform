# Queueing and TCP congestion control.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0

# Retire dead TCP tunnels in minutes instead of inheriting Linux's two-hour
# keepalive delay. Per-profile Xray sockopts use tighter values where supported.
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 4
net.ipv4.tcp_retries2 = 8

# Socket limits large enough for Xray QUIC/Hysteria receive windows.
net.core.rmem_default = 1048576
net.core.rmem_max = 33554432
net.core.wmem_default = 1048576
net.core.wmem_max = 33554432
net.core.netdev_max_backlog = 16384
net.core.optmem_max = 262144

# Per-protocol floors and TCP autotuning ceilings.
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216
