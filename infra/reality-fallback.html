<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Rovyn Network</title>
    <style>
      html {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #050807;
        color: #e9fffb;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        background:
          radial-gradient(circle at 20% 10%, #0b6861 0, transparent 35%),
          radial-gradient(circle at 90% 90%, #0b8f82 0, transparent 30%),
          #050807;
      }
      main {
        padding: 2rem 2.5rem;
        border: 1px solid #ffffff1f;
        border-radius: 2rem;
        background: #0d1513cc;
        backdrop-filter: blur(20px);
        text-align: center;
      }
      p {
        color: #9eb9b4;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rovyn Network</h1>
      <p>Защищённая сетевая инфраструктура.</p>
    </main>
  </body>
</html>
