name: vpn-platform-gateway

services:
  caddy:
    image: caddy:2.10.2-alpine
    container_name: vpn-platform-caddy
    network_mode: host
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
    name: vpn-platform-caddy-data
  caddy_config:
    name: vpn-platform-caddy-config
