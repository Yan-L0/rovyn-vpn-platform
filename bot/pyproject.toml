[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vpn-platform-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.21,<4",
  "pydantic-settings>=2.10,<3",
  "structlog>=25.4,<26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vpn_bot"]

[tool.ruff]
target-version = "py312"
line-length = 100
