<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="NOVA VPN — единая подписка для Happ и v2RayTun с управлением в Telegram." />
    <meta name="theme-color" content="#050706" />
    <title>NOVA VPN — интернет без лишних ограничений</title>
    <script>
      if (location.pathname.startsWith('/cabinet')) {
        document.documentElement.classList.add('cabinet-boot')
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0b302d')
        document.addEventListener('DOMContentLoaded', () => {
          if (document.getElementById('cabinet-styles')) return
          const cabinetStyles = document.createElement('link')
          cabinetStyles.id = 'cabinet-styles'
          cabinetStyles.rel = 'stylesheet'
          cabinetStyles.href = '/cabinet-v2.css?v=24'
          cabinetStyles.onload = () => document.documentElement.classList.add('cabinet-styles-ready')
          cabinetStyles.onerror = () => document.documentElement.classList.add('cabinet-styles-error')
          document.head.append(cabinetStyles)
        }, { once: true })
      }
    </script>
    <style>
      html.cabinet-boot,
      html.cabinet-boot body,
      html.cabinet-boot #root {
        min-height: 100%;
        margin: 0;
        background:
          radial-gradient(ellipse 72% 48% at 10% 7%, rgba(76, 205, 187, .34), transparent 72%),
          radial-gradient(ellipse 70% 52% at 92% 94%, rgba(45, 161, 143, .28), transparent 74%),
          linear-gradient(145deg, #1b756d 0%, #0b3833 38%, #061f1d 70%, #12655e 100%);
      }
      html.cabinet-boot body { min-width: 320px; min-height: 100vh; min-height: 100svh; opacity: 0; }
      html.cabinet-boot.cabinet-styles-ready body {
        opacity: 1;
        transition: opacity 280ms cubic-bezier(.22, 1, .36, 1);
      }
      html.cabinet-boot.cabinet-styles-error::after {
        content: 'Не удалось загрузить интерфейс';
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        color: rgba(242, 246, 239, .86);
        font: 600 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      @media (prefers-reduced-motion: reduce) {
        html.cabinet-boot.cabinet-styles-ready body { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
